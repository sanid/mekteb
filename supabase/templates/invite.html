<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body style="margin:0;padding:0;background:#f9fafb;font-family:system-ui,-apple-system,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:40px auto;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
    <tr>
      <td style="padding:32px 40px;">
        <h1 style="margin:0 0 16px;font-size:20px;color:#111827;">Welcome to Mekteb</h1>
        <p style="margin:0 0 24px;font-size:15px;color:#4b5563;line-height:1.6;">
          An account has been created for you. Click the button below to set your password and get started.
        </p>
        <table width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td align="center">
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;padding:12px 28px;background:#1d4ed8;color:#fff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:600;">
                Set your password
              </a>
            </td>
          </tr>
        </table>
        <p style="margin:24px 0 0;font-size:13px;color:#9ca3af;">
          If you did not expect this email, you can safely ignore it.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 40px;background:#f9fafb;border-top:1px solid #e5e7eb;">
        <p style="margin:0;font-size:12px;color:#9ca3af;text-align:center;">
          Mekteb — Mosque education and community platform
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
