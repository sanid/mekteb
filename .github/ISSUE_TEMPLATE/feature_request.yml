name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can a mosque, teacher, parent or student not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web portal, Mobile app, Database / migrations, Translations, Documentation, Other]
    validations:
      required: true
  - type: dropdown
    id: roles
    attributes:
      label: Which roles would use this?
      multiple: true
      options: [Admin, Teacher, Parent, Student, Examiner, Platform admin]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
